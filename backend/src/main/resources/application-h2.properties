# --- Server ---
server.port=8080

# --- H2 Database Configuration ---
spring.datasource.url=jdbc:h2:file:./data/finsync_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- JWT ---
finsync.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForProductionUse123456
finsync.jwt.expiration-ms=86400000
